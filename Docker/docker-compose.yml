version: '3.8'

services:
  cloudshield-mssp-portal:
    image: cloudshield-mssp-portal:latest
    build:
      context: ..
      dockerfile: Docker/Dockerfile
    container_name: cloudshield-mssp-portal
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ENVIRONMENT=Production
      - TZ=Europe/Istanbul
    volumes:
      - ../Data:/app/Data
      - ../Engine/Output:/app/Engine/Output
      - ../Engine/Config:/app/Engine/Config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
