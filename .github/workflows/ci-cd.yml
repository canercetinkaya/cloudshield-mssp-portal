name: CloudShield Security Reporting CI/CD — Enterprise Pipeline

on:
  push:
    branches: [ "main", "release/*", "feature/*", "pilot/*" ]
  pull_request:
    branches: [ "main", "release/*" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  validate-and-test:
    name: 🧪 Automated QA & Security Verification
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Depoyu Klonla (Checkout)
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Python Bağımlılıkları Kurulumu
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Statik Sözdizimi & Modül Derleme Denetimi
        shell: bash
        run: |
          echo "=== 1. Python Kod Doğrulaması ==="
          python -m py_compile Portal/api/server.py Portal/api/report_generator.py Portal/api/rbac_engine.py Portal/api/rbac_handlers.py Portal/api/license_intelligence.py Portal/api/license_collector.py Portal/api/license_catalog_updater.py Portal/api/license_report_generator.py database/db.py
          
          echo "=== 2. JSON Dosyaları Sözdizim Doğrulaması ==="
          python -c "import json; [json.load(open(f, encoding='utf-8')) for f in ['Data/tenants.json', 'Data/dispatch_logs.json', 'Data/users.json', 'Data/auth_config.json', 'Azure/azuredeploy.json', 'config/catalog/license-catalog.json', 'config/catalog/catalog-feed-state.json', 'version.json', 'Data/version.json']]"
          
          echo "=== 3. Zero SOC / Bilet İzolasyon Denetimi ==="
          python Scripts/verify_zero_soc.py

      - name: 🧪 Birim ve Güvenlik Testleri (92 Test)
        shell: bash
        run: |
          python -m unittest discover tests

      - name: 📊 Kolektör-Rapor Mutabakat Testleri (9 Test)
        shell: bash
        run: |
          python -m unittest tests/test_collector_to_report_reconciliation.py

      - name: 🛡️ Kapsamlı Platform QA Test Paketi (60 Test)
        shell: bash
        run: |
          python tests/test_comprehensive_qa.py

      - name: ⚡ PowerShell & KQL Motor Bütünlük Testi
        shell: pwsh
        run: |
          Import-Module ./Engine/Core/KqlQueryEngine.psm1 -Force
          $queries = Get-StandardHuntQueries -StartDate (Get-Date).AddDays(-30) -EndDate (Get-Date)
          Write-Host "KQL Motoru Başarıyla Yüklendi. Tanımlı Sorgu Sayısı: $($queries.Count)"

  container-build-smoke:
    name: 🐳 Container Build, Smoke Test, Security Scan & SBOM
    needs: validate-and-test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Depoyu Klonla (Checkout)
        uses: actions/checkout@v4

      - name: 🔨 Container İmajını Derle (3.2.0-pilot & sha-<commit>)
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${REPO_OWNER}/cloudshield-reporting-platform"
          IMAGE_LEGACY="ghcr.io/${REPO_OWNER}/cloudshield-mssp-portal"
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
          echo "IMAGE_LEGACY=$IMAGE_LEGACY" >> $GITHUB_ENV
          docker build \
            -t "$IMAGE_NAME:3.2.0-pilot" \
            -t "$IMAGE_NAME:sha-${{ github.sha }}" \
            -t "$IMAGE_LEGACY:3.2.0-pilot" \
            -t "$IMAGE_LEGACY:sha-${{ github.sha }}" \
            -t "$IMAGE_LEGACY:${{ github.sha }}" \
            -t "$IMAGE_LEGACY:latest" \
            -t "cloudshield-reporting-platform:ci-test" \
            -f Docker/Dockerfile .

      - name: 🧪 Container Başlatma & Smoke Test
        run: |
          docker run -d --name test-app -p 8080:8080 \
            -e ENVIRONMENT=production \
            -e MAX_REPLICAS=1 \
            -e CLOUDSHIELD_SESSION_SECRET=ci-testing-secret-token-must-be-32-chars \
            cloudshield-reporting-platform:ci-test
          
          sleep 5
          docker logs test-app
          curl --fail --retry 5 --retry-delay 2 http://localhost:8080/api/health
          VERSION_RESP=$(curl --fail http://localhost:8080/api/version)
          echo "Version Response: $VERSION_RESP"
          echo "$VERSION_RESP" | grep -q "v3.2.0-LICENSE-INTELLIGENCE"
          docker stop test-app

      - name: 🛡️ Container Güvenlik Açığı Taraması (Trivy Scan)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: "cloudshield-reporting-platform:ci-test"
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: 📦 SBOM Üretimi (SPDX JSON Formatı)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: "cloudshield-reporting-platform:ci-test"
          format: 'spdx-json'
          output: 'sbom-cloudshield-3.2.0.spdx.json'

      - name: 📤 SBOM Dosyasını Arşivle
        uses: actions/upload-artifact@v4
        with:
          name: cloudshield-sbom-v3.2.0
          path: sbom-cloudshield-3.2.0.spdx.json

      - name: 🔐 GHCR Girişi Yap (GitHub Container Registry)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Container İmajını GHCR'ye Gönder (3.2.0-pilot & sha-<commit>)
        run: |
          docker push "$IMAGE_NAME:3.2.0-pilot"
          docker push "$IMAGE_NAME:sha-${{ github.sha }}"
          docker push "$IMAGE_LEGACY:3.2.0-pilot"
          docker push "$IMAGE_LEGACY:sha-${{ github.sha }}"
          docker push "$IMAGE_LEGACY:${{ github.sha }}"
          docker push "$IMAGE_LEGACY:latest"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_NAME:3.2.0-pilot" || echo "digest-pending")
          echo "IMAGE_DIGEST=$DIGEST" >> $GITHUB_ENV
          echo "Pushed Image Digest: $DIGEST"

  azure-arm-validate:
    name: ☁️ Azure Resource Manager & Bicep Validation
    needs: validate-and-test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Depoyu Klonla (Checkout)
        uses: actions/checkout@v4

      - name: 🛡️ ARM Template JSON Syntax Kontrolü
        shell: bash
        run: |
          python -c "import json; data = json.load(open('Azure/azuredeploy.json', encoding='utf-8')); assert any('schema' in k for k in data); assert len(data['resources']) >= 4; print('ARM Şablonu Geçerli!')"

  azure-deploy:
    name: 🚀 Deploy to Azure Container Apps
    needs: [container-build-smoke, azure-arm-validate]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: 📥 Depoyu Klonla (Checkout)
        uses: actions/checkout@v4

      - name: 🔐 Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CSMSSPPOCAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CSMSSPPOCAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CSMSSPPOCAPP_AZURE_SUBSCRIPTION_ID }}

      - name: 🚀 Deploy & Verify Revision in Azure Container Apps
        env:
          GITHUB_SHA: ${{ github.sha }}
          CONTAINER_IMAGE_TAG: "ghcr.io/canercetinkaya/cloudshield-mssp-portal:3.2.0-pilot"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 Azure/deploy_aca.py
