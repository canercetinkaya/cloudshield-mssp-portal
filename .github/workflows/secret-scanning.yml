name: DevSecOps Secret & Credential Scanning

on:
  push:
    branches: [ "main", "develop", "release/*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  gitleaks-scan:
    name: 🛡️ Gitleaks Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Run Gitleaks Secret Detector
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: true

  trufflehog-scan:
    name: 🐗 TruffleHog High-Entropy Scan
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 TruffleHog Open Source CLI
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
        continue-on-error: true

  devsecops-pattern-audit:
    name: 🔬 MSSP Static Credential Guardrail Audit
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🚨 Verify No Hardcoded Passwords or Plaintext Secrets in Tracked Files
        shell: bash
        run: |
          echo "=== Auditing repository for plaintext credentials and private keys ==="
          FAIL=0
          
          # 1. Check for private key formats
          if grep -rnE --exclude-dir={.git,.venv,node_modules} "-----BEGIN (RSA|EC|OPENSSH|DSA|PRIVATE) KEY-----" .; then
            echo "::error::CRITICAL: Tracked private key found in repository!"
            FAIL=1
          fi

          # 2. Check for leaked API secrets or tenant client secrets
          if grep -rnE --exclude-dir={.git,.venv,node_modules} --exclude="*.template.json" --exclude="*.md" "\"ClientSecret\"\s*:\s*\"[^\"]{10,}\"" .; then
            echo "::error::CRITICAL: Tracked plaintext ClientSecret detected in configuration!"
            FAIL=1
          fi

          # 3. Check for plaintext default passwords in documentation or code
          if grep -rnE --exclude-dir={.git,.venv,node_modules} "CloudShield2026!\*" README.md Engine/ Portal/web/; then
            echo "::error::CRITICAL: Default admin password exposed in public documentation or web UI!"
            FAIL=1
          fi

          if [ $FAIL -eq 1 ]; then
            echo "Static DevSecOps audit FAILED. Please remediate exposed secrets before pushing."
            exit 1
          else
            echo "✅ DevSecOps Static Credential Guardrail Audit PASSED: Zero leaked secrets detected."
          fi
