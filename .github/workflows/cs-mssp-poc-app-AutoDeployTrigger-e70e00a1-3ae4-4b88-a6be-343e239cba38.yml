name: Trigger auto deployment for cs-mssp-poc-app

# IMAGE PULL FIX: GITHUB_TOKEN expires after the job — ACA cannot pull on next cold-start.
# Solution: GHCR_PAT (Personal Access Token, read:packages scope) stored as repo secret.
#   → Settings > Secrets > Actions > New secret: Name=GHCR_PAT, Value=<PAT>
# If GHCR_PAT is not set, falls back to GITHUB_TOKEN (may fail on ACA cold-start).
# Alternative: make the GHCR package public (Packages > cloudshield-mssp-portal > Package settings > Make public)

on:
  push:
    branches: 
      [ main ]
    paths:
    - '**'
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CSMSSPPOCAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CSMSSPPOCAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CSMSSPPOCAPP_AZURE_SUBSCRIPTION_ID }}

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Prefer GHCR_PAT (long-lived) over GITHUB_TOKEN (expires after job)
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Build & Push Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Docker/Dockerfile
          push: true
          tags: |
            ghcr.io/canercetinkaya/cloudshield-mssp-portal:${{ github.sha }}
            ghcr.io/canercetinkaya/cloudshield-mssp-portal:latest

      - name: Deploy to Azure Container Apps
        env:
          GITHUB_SHA: ${{ github.sha }}
          # Pass GHCR_PAT preferentially so ACA stores a long-lived pull credential
          GITHUB_TOKEN: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          python3 Azure/deploy_aca.py

