name: Trigger auto deployment for cs-mssp-poc-app

on:
  push:
    branches: 
      [ main ]
    paths:
    - '**'
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔑 Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CSMSSPPOCAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CSMSSPPOCAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CSMSSPPOCAPP_AZURE_SUBSCRIPTION_ID }}

      - name: 🔑 Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Build & Push Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Docker/Dockerfile
          push: true
          tags: |
            ghcr.io/canercetinkaya/cloudshield-mssp-portal:${{ github.sha }}
            ghcr.io/canercetinkaya/cloudshield-mssp-portal:latest

      - name: 🚀 Clean & Deploy Single-Container ACA Topology
        shell: bash
        run: |
          set -e
          echo "=== 1. Resolving Managed Environment ID ==="
          ENV_ID=$(az containerapp show -n cs-mssp-poc-app -g cloudshield --query properties.managedEnvironmentId -o tsv)
          echo "Managed Environment: $ENV_ID"
          
          echo "=== 2. Generating Clean Single-Container Deployment Manifest ==="
          cat << EOF > aca_deployment.yaml
properties:
  managedEnvironmentId: "$ENV_ID"
  configuration:
    activeRevisionsMode: Single
    ingress:
      external: true
      targetPort: 8080
      transport: Auto
      allowInsecure: false
    registries:
      - server: ghcr.io
        username: canercetinkaya
        passwordSecretRef: ghcrio-secret
    secrets:
      - name: ghcrio-secret
        value: "${{ secrets.GITHUB_TOKEN }}"
  template:
    containers:
      - name: cloudshield-mssp-portal
        image: "ghcr.io/canercetinkaya/cloudshield-mssp-portal:${{ github.sha }}"
        resources:
          cpu: 0.5
          memory: 1.0Gi
        env:
          - name: PORT
            value: "8080"
          - name: ENVIRONMENT
            value: "poc"
    scale:
      minReplicas: 1
      maxReplicas: 3
EOF
          
          echo "=== 3. Applying Clean Deployment to Azure Container Apps ==="
          az containerapp update -n cs-mssp-poc-app -g cloudshield --yaml aca_deployment.yaml
          
          echo "=== 4. Checking Active Revisions & Health ==="
          az containerapp revision list -n cs-mssp-poc-app -g cloudshield -o table
          
          echo "=== 5. Verifying Live Health Endpoint via Curl ==="
          for i in {1..12}; do
            echo "Health probe attempt \$i..."
            if curl -s -f -m 10 "https://cs-mssp-poc-app.icygrass-237b4292.westeurope.azurecontainerapps.io/api/health"; then
              echo ""
              echo "[SUCCESS] cs-mssp-poc-app is LIVE, HEALTHY, and RESPONDING!"
              exit 0
            fi
            sleep 5
          done
          echo "[WARN] Verification probe timed out, checking container logs:"
          az containerapp logs show -n cs-mssp-poc-app -g cloudshield --tail 50 || true
