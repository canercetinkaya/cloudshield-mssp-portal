name: Trigger auto deployment for cs-mssp-poc-app

on:
  push:
    branches: 
      [ main ]
    paths:
    - '**'
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔑 Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CSMSSPPOCAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CSMSSPPOCAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CSMSSPPOCAPP_AZURE_SUBSCRIPTION_ID }}

      - name: 🔑 Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Build & Push Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Docker/Dockerfile
          push: true
          tags: |
            ghcr.io/canercetinkaya/cloudshield-mssp-portal:${{ github.sha }}
            ghcr.io/canercetinkaya/cloudshield-mssp-portal:latest

      - name: 🚀 Clean & Deploy Single-Container ACA Topology
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python Azure/deploy_aca.py
