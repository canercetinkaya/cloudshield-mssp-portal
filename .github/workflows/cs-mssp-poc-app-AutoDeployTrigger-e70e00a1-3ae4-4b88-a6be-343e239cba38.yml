name: Trigger auto deployment for cs-mssp-poc-app

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/cs-mssp-poc-app-AutoDeployTrigger-e70e00a1-3ae4-4b88-a6be-343e239cba38.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write # This is required for requesting the OIDC JWT Token
      contents: read # Required when GH token is used to authenticate with repo
      packages: write # Required for publishing and pushing Docker container to GHCR

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CSMSSPPOCAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CSMSSPPOCAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CSMSSPPOCAPP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: Docker/Dockerfile
          registryUrl: ghcr.io
          registryUsername: ${{ github.actor }}
          registryPassword: ${{ secrets.GITHUB_TOKEN }}
          containerAppName: cs-mssp-poc-app
          resourceGroup: cloudshield
          imageToBuild: ghcr.io/canercetinkaya/cloudshield-mssp-portal:${{ github.sha }}
          targetPort: 8080

      - name: 🛡️ Diagnose & Enforce High Availability (ACA Ingress & Scale)
        shell: bash
        run: |
          echo "=== 1. Azure Container App Configuration ==="
          az containerapp show -n cs-mssp-poc-app -g cloudshield --query "{ingress:properties.configuration.ingress, provisioningState:properties.provisioningState, runningStatus:properties.runningStatus}" -o json
          
          echo "=== 2. Enforcing Target Port 8080 and Min Replicas 1 ==="
          az containerapp ingress update -n cs-mssp-poc-app -g cloudshield --target-port 8080 --transport auto --type external
          az containerapp update -n cs-mssp-poc-app -g cloudshield --min-replicas 1 --max-replicas 3
          
          echo "=== 3. Active Revisions & Replica Health ==="
          az containerapp revision list -n cs-mssp-poc-app -g cloudshield -o table
          
          echo "=== 4. Recent Container App Console Logs ==="
          az containerapp logs show -n cs-mssp-poc-app -g cloudshield --tail 50 || true
